<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Scraper Status</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d1117;color:#e6edf3;font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:env(safe-area-inset-top,16px) 12px env(safe-area-inset-bottom,16px)}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}
  h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .updated{font-size:12px;color:#7d8590}
  .btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn:active{background:#30363d}
  .grid{display:grid;grid-template-columns:1fr;gap:10px;max-width:640px;margin:0 auto}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;text-decoration:none;color:inherit;display:block;transition:border-color .15s}
  .card:active{border-color:#58a6ff}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .name{font-weight:600;font-size:15px}
  .status{display:flex;align-items:center;gap:6px;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .ok{background:#3fb950}
  .fail{background:#f85149}
  .run{background:#d29922;animation:pulse 1.6s ease-in-out infinite}
  .none{background:#7d8590}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .meta{font-size:12px;color:#7d8590;display:flex;justify-content:space-between;gap:8px}
  .meta div:last-child{text-align:right}
  .commit{margin-top:8px;font-size:11px;color:#7d8590;border-top:1px solid #21262d;padding-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .err{color:#f85149;font-size:13px;padding:14px;text-align:center;background:#161b22;border:1px solid #30363d;border-radius:10px}
  .setup{max-width:420px;margin:48px auto 0;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px}
  .setup h2{font-size:16px;margin-bottom:12px}
  .setup p{font-size:13px;color:#7d8590;margin-bottom:10px;line-height:1.55}
  .setup a{color:#58a6ff;text-decoration:none}
  .setup input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:9px 11px;border-radius:6px;font-size:14px;margin-bottom:10px;font-family:ui-monospace,monospace}
  .setup input:focus{outline:none;border-color:#58a6ff}
  .setup .btn{width:100%;background:#238636;border-color:#238636;padding:9px;font-size:14px}
  .setup .btn:active{background:#1f6f2c}
  .setup ol{margin:6px 0 14px 18px;font-size:13px;color:#7d8590;line-height:1.7}
  .setup code{background:#0d1117;padding:1px 5px;border-radius:3px;font-size:12px;color:#e6edf3;font-family:ui-monospace,monospace}
  footer{text-align:center;font-size:11px;color:#484f58;padding:20px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const OWNER="mrakader";
const REPOS=[
  {key:"mrprice",      repo:"scraper",                label:"Mr Price"},
  {key:"tfg",          repo:"tfg-scraper",            label:"TFG"},
  {key:"bashmens",     repo:"bash-mens-scraper",      label:"bash-mens"},
  {key:"superbalist",  repo:"superbalist-scraper",    label:"Superbalist"},
  {key:"evolve",       repo:"evolve-scraper",         label:"Evolve"},
  {key:"fashionfusion",repo:"fashion-fusion-scraper", label:"Fashion Fusion"}
];
const TOKEN_KEY="ss_gh_pat_v1";
const app=document.getElementById("app");

function token(){return localStorage.getItem(TOKEN_KEY)||""}
function setToken(t){if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY)}
function rel(iso){
  if(!iso)return"—";
  const d=new Date(iso),s=(Date.now()-d.getTime())/1000;
  if(s<60)return Math.floor(s)+"s ago";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function dur(start,end){
  if(!start||!end)return"—";
  const s=Math.floor((new Date(end)-new Date(start))/1000);
  if(s<60)return s+"s";
  const m=Math.floor(s/60),r=s%60;
  if(m<60)return m+"m "+r+"s";
  return Math.floor(m/60)+"h "+(m%60)+"m";
}
function fmtDate(iso){
  if(!iso)return"";
  return new Date(iso).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}

async function gh(path){
  const r=await fetch("https://api.github.com"+path,{
    headers:{Authorization:"Bearer "+token(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
  });
  if(r.status===401||r.status===403)throw Object.assign(new Error("auth"),{auth:true});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

async function loadRepo(r){
  try{
    const [runs,commits]=await Promise.all([
      gh(`/repos/${OWNER}/${r.repo}/actions/runs?per_page=1`),
      gh(`/repos/${OWNER}/${r.repo}/commits?per_page=1`)
    ]);
    const run=(runs.workflow_runs||[])[0];
    const commit=commits[0]||{};
    return {ok:true,run,commit};
  }catch(e){return {ok:false,err:e}}
}

function statusOf(run){
  if(!run)return{cls:"none",label:"no runs"};
  if(run.status==="in_progress"||run.status==="queued")return{cls:"run",label:run.status==="queued"?"queued":"running"};
  if(run.conclusion==="success")return{cls:"ok",label:"success"};
  if(run.conclusion==="failure"||run.conclusion==="timed_out")return{cls:"fail",label:run.conclusion};
  if(run.conclusion==="cancelled")return{cls:"fail",label:"cancelled"};
  return{cls:"none",label:run.conclusion||run.status||"unknown"};
}

function renderSetup(msg){
  app.innerHTML=`
    <header><h1>Scraper Status</h1></header>
    <div class="setup">
      <h2>One-time setup</h2>
      ${msg?`<p style="color:#f85149">${msg}</p>`:""}
      <p>This dashboard reads GitHub Actions status for your private scraper repos. It needs a Personal Access Token (PAT) with read-only repo permission. The token is stored only in your browser's localStorage.</p>
      <ol>
        <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com/settings/personal-access-tokens/new</a></li>
        <li>Token name: <code>scraper-dashboard</code></li>
        <li>Expiration: 1 year</li>
        <li>Repository access: Selected repositories → pick all 6 scrapers</li>
        <li>Permissions → Repository → Actions: <b>Read</b>, Contents: <b>Read</b>, Metadata: <b>Read</b></li>
        <li>Generate, copy, paste below</li>
      </ol>
      <input id="t" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" onclick="saveToken()">Save &amp; load dashboard</button>
    </div>
    <footer>github.com/mrakader/scraper-dashboard</footer>`;
  document.getElementById("t").focus();
}
window.saveToken=function(){
  const v=document.getElementById("t").value.trim();
  if(!v)return;
  setToken(v);
  loadAll();
};

function cardHTML(r,data){
  if(!data.ok){
    return `<div class="card" style="opacity:.6"><div class="card-head"><span class="name">${r.label}</span><span class="status"><span class="dot none"></span>error</span></div><div class="meta"><div>${data.err&&data.err.message||"failed"}</div></div></div>`;
  }
  const s=statusOf(data.run);
  const run=data.run||{};
  const c=data.commit||{};
  const commitMsg=(c.commit&&c.commit.message||"—").split("\n")[0].slice(0,80);
  const commitWhen=c.commit&&(c.commit.author||c.commit.committer);
  return `<a class="card" href="https://github.com/${OWNER}/${r.repo}/actions" target="_blank" rel="noopener">
    <div class="card-head"><span class="name">${r.label}</span><span class="status"><span class="dot ${s.cls}"></span>${s.label}</span></div>
    <div class="meta"><div>${run.run_started_at?rel(run.run_started_at):"never"}</div><div>${run.status==="completed"?dur(run.run_started_at,run.updated_at):run.status==="in_progress"?"running":""}</div></div>
    <div class="commit">${commitMsg}${commitWhen?" · "+rel(commitWhen.date):""}</div>
  </a>`;
}

let lastUpdate=null;
function renderDashboard(results){
  lastUpdate=Date.now();
  app.innerHTML=`
    <header>
      <h1>Scraper Status</h1>
      <button class="btn" onclick="refresh()">Refresh</button>
    </header>
    <div class="grid">${REPOS.map((r,i)=>cardHTML(r,results[i])).join("")}</div>
    <footer>Updated <span id="upd">just now</span> · <a href="#" onclick="event.preventDefault();logout()" style="color:#7d8590">change token</a></footer>`;
  tickUpd();
}
function tickUpd(){
  const el=document.getElementById("upd");
  if(!el||!lastUpdate)return;
  el.textContent=rel(new Date(lastUpdate).toISOString());
  setTimeout(tickUpd,15000);
}
window.logout=function(){setToken("");renderSetup()};
window.refresh=function(){loadAll()};

async function loadAll(){
  if(!token())return renderSetup();
  app.innerHTML=`<header><h1>Scraper Status</h1></header><div class="err" style="opacity:.6">Loading…</div>`;
  let authFailed=false;
  const results=await Promise.all(REPOS.map(async r=>{
    const res=await loadRepo(r);
    if(!res.ok&&res.err&&res.err.auth)authFailed=true;
    return res;
  }));
  if(authFailed)return renderSetup("Token rejected or expired. Please paste a new one.");
  renderDashboard(results);
}

// auto-refresh every 60s when visible
let refreshTimer=null;
function startTimer(){
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{if(!document.hidden&&token())loadAll()},60000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&token())loadAll()});
startTimer();

loadAll();
</script>
</body>
</html>
